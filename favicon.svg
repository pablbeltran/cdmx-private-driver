<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CDMX Private Cars — car with a low Aztec stepped-platform roof -->
  <rect width="64" height="64" fill="#111111"/>
  <g fill="#ffffff">
    <!-- stepped roof (wide, low Aztec platform) -->
    <path d="M16 28 L16 24 L23 24 L23 20 L41 20 L41 24 L48 24 L48 28 Z"/>
    <!-- car body -->
    <path d="M8 34 L12 28 L52 28 L56 34 Z"/>
    <!-- wheels -->
    <circle cx="18" cy="39" r="5.2"/>
    <circle cx="46" cy="39" r="5.2"/>
  </g>
  <!-- wheel hubs -->
  <circle cx="18" cy="39" r="2.4" fill="#111111"/>
  <circle cx="46" cy="39" r="2.4" fill="#111111"/>
</svg>
